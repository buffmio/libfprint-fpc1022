name: Build packages

on:
  push:
    branches: [master, source-release-candidate]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install contract test tools
        run: |
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already available"
          else
            timeout 180s sudo apt-get update -o Acquire::Retries=3
            timeout 180s sudo apt-get install -y ripgrep
          fi
      - name: Validate packaging contracts
        run: |
          bash packaging/test-release-contract.sh
          bash packaging/arch/test-pkgbuild.sh
          bash packaging/debian/test-debian-package.sh
          bash packaging/rpm/test-rpm-package.sh
          bash packaging/test-workflows.sh
          bash packaging/test-docs.sh

  build:
    needs: contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: ubuntu
            image: ubuntu:latest
            script: build-deb.sh
          - family: debian
            image: debian:stable
            script: build-deb.sh
          - family: fedora
            image: fedora:latest
            script: build-rpm.sh
    container:
      image: ${{ matrix.image }}
    env:
      DISTRO_FAMILY: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build native package
        run: bash ".github/scripts/${{ matrix.script }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.family }}
          path: artifacts
          retention-days: 7
          if-no-files-found: error
