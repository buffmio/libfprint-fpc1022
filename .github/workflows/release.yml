name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: ubuntu
            image: ubuntu:latest
            script: build-deb.sh
          - family: debian
            image: debian:stable
            script: build-deb.sh
          - family: fedora
            image: fedora:latest
            script: build-rpm.sh
    container:
      image: ${{ matrix.image }}
    env:
      DISTRO_FAMILY: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build native package
        run: bash ".github/scripts/${{ matrix.script }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.family }}
          path: artifacts
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Validate tag and collect artifacts
        run: |
          source packaging/version.env
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          fi
          .github/scripts/collect-release.sh artifacts release
          test -f release/SHA256SUMS
      - name: Ensure release exists
        run: |
          source packaging/version.env
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "libfprint-fpc1022 $RELEASE_TAG" \
              --notes-file docs/release-notes-v0.1.0-wip.md \
              --verify-tag
          fi
      - name: Upload release assets
        run: |
          source packaging/version.env
          gh release upload "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
